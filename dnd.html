<title>DND — Encounter Board</title>
<style>
:root{color-scheme:dark;--bg:#0b0909;--panel:#171313;--panel2:#211919;--line:#3c3030;--ink:#f4ead8;--muted:#a99b8e;--gold:#e6b85c;--gold2:#8f682c;--red:#a73935;--red2:#5c201f;--green:#58a879;--shadow:0 18px 60px #0009}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 Inter,ui-sans-serif,system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 0,#5a201625,transparent 34%),radial-gradient(circle at 90% 100%,#6d4a1a1c,transparent 35%),linear-gradient(135deg,#ffffff03 25%,transparent 25% 50%,#ffffff03 50% 75%,transparent 75%);background-size:auto,auto,16px 16px}.app{min-height:100vh;position:relative}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 24px;background:#0d0a0af2;position:sticky;top:0;z-index:20;backdrop-filter:blur(15px)}.brand-mark{width:44px;height:44px;display:grid;place-items:center;clip-path:polygon(50% 0,94% 25%,82% 88%,18% 88%,6% 25%);background:linear-gradient(145deg,var(--gold),#8c5d21);color:#170f08;font:900 13px Georgia,serif}.brand h1{font:700 23px Georgia,serif;letter-spacing:.08em;margin:0}.brand p{font-size:12px;color:var(--muted);margin:1px 0 0}.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}.save-state{font-size:12px;color:var(--muted)}.save-state:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px;box-shadow:0 0 10px #58a87988}.back{color:var(--muted);text-decoration:none;font-weight:800;font-size:13px}.back:hover{color:var(--gold)}button,input,select{font:inherit}button{color:inherit}.workspace{display:grid;grid-template-columns:minmax(360px,470px) minmax(0,1fr);min-height:calc(100vh - 76px)}.encounter{border-right:1px solid var(--line);padding:20px;min-width:0;background:#110e0edb}.statblocks{padding:20px;min-width:0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}.section-head h2{font:700 19px Georgia,serif;margin:0;letter-spacing:.04em}.badge{font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--gold);border:1px solid #e6b85c44;padding:5px 8px}.panel{border:1px solid var(--line);background:linear-gradient(150deg,#211919f0,#151111f2);box-shadow:var(--shadow)}.add-form{display:grid;grid-template-columns:1.5fr .7fr .7fr auto;gap:8px;padding:12px;margin-bottom:14px}.field{min-width:0}.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin:0 0 5px;text-transform:uppercase;letter-spacing:.08em}.field input,.resource-input{width:100%;border:1px solid var(--line);background:#0e0b0b;color:var(--ink);padding:9px 10px;min-height:42px}.field input:focus,.resource-input:focus{outline:2px solid var(--gold);outline-offset:1px}.btn{border:1px solid var(--line);background:#241b1b;padding:9px 12px;cursor:pointer;font-weight:850;min-height:42px}.btn:hover{border-color:var(--gold2);background:#302222}.btn.primary{border-color:#d0a34e;background:linear-gradient(145deg,#a87328,#604116);color:#fff5dc}.btn.danger{color:#eeaaa7;border-color:#7f302d;background:#261313}.btn.small{min-height:32px;padding:5px 9px;font-size:12px}.add-form>.btn{align-self:end}.turnbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.round{flex:1;text-align:center;font:700 15px Georgia,serif;color:var(--gold)}.combatants{display:grid;gap:9px}.empty{border:1px dashed #4a3939;color:var(--muted);text-align:center;padding:28px 18px}.combatant{border:1px solid var(--line);background:#181212;overflow:hidden}.combatant.active{border-color:var(--gold);box-shadow:inset 4px 0 var(--gold),0 0 22px #c68d3020}.combatant-main{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:11px;align-items:center;padding:11px}.init{width:42px;height:42px;display:grid;place-items:center;border:1px solid #695133;background:#0e0b0b;color:var(--gold);font:700 19px Georgia,serif;transform:rotate(45deg)}.init span{transform:rotate(-45deg)}.who{min-width:0}.who strong{font:700 17px Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.turn-label{font-size:11px;color:var(--gold);font-weight:900;letter-spacing:.08em}.hp-line{display:flex;align-items:center;gap:7px;margin-top:6px}.hpbar{height:6px;flex:1;background:#0b0808;border:1px solid #3e2c2c}.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#7d2522,#db5b4f);transition:.2s}.hptext{font-size:12px;color:var(--muted);min-width:58px;text-align:right}.hp-actions{display:flex;gap:5px;align-items:center}.hp-actions input{width:54px;text-align:center;padding:7px 4px;border:1px solid var(--line);background:#0d0a0a;color:var(--ink)}.icon-btn{width:34px;height:34px;border:1px solid var(--line);background:#251b1b;cursor:pointer;font-weight:900}.icon-btn:hover{border-color:var(--gold)}.combatant-tools{display:flex;border-top:1px solid var(--line);background:#130f0f}.combatant-tools button{flex:1;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);padding:8px;cursor:pointer;font-size:12px;font-weight:800}.combatant-tools button:hover{color:var(--ink);background:#211818}.resources{border-top:1px solid var(--line);padding:12px;background:#100d0d}.resources h3{font:700 14px Georgia,serif;margin:0 0 9px;color:var(--gold)}.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:12px}.slot-row{border:1px solid #392d2d;padding:7px;background:#171111}.slot-row label{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.slot-pips{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}.pip{width:18px;height:18px;border:1px solid #8b6734;background:#241a12;cursor:pointer;transform:rotate(45deg)}.pip.used{background:#080606;border-color:#47382a}.ability-list{display:grid;gap:6px}.ability{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:5px;align-items:center}.ability span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ability b{font-size:12px;color:var(--gold)}.ability-add{display:grid;grid-template-columns:minmax(0,1fr) 70px auto;gap:6px;margin-top:8px}.pdf-toolbar{padding:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.upload{position:relative;overflow:hidden}.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}.dropzone{border:1px dashed #705834;background:#171210;padding:11px 14px;color:var(--muted);font-size:13px;flex:1;min-width:210px;text-align:center}.dropzone.drag{border-color:var(--gold);color:var(--gold);background:#2a2114}.view-picks{display:flex;gap:4px}.view-picks button.on{border-color:var(--gold);color:var(--gold)}.pdf-library{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}.pdf-chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#1a1414;padding:6px 7px 6px 10px;max-width:310px}.pdf-chip.open{border-color:#9d783a}.pdf-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.pdf-chip button{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:3px}.pdf-chip button:hover{color:#fff}.pdf-grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:12px;align-items:start}.pdf-card{border:1px solid var(--line);background:#151111;box-shadow:var(--shadow);min-width:0}.pdf-card-head{height:44px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line)}.pdf-card-head strong{font:700 14px Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.pdf-frame{width:100%;height:68vh;min-height:480px;border:0;background:#272222;display:block}.fullscreen{position:fixed;inset:0;z-index:80;background:#080606ed;padding:18px;display:grid;grid-template-rows:auto 1fr}.fullscreen[hidden]{display:none}.fullscreen .modal-head{display:flex;align-items:center;gap:12px;padding:0 0 12px}.fullscreen .modal-head strong{font:700 18px Georgia,serif;flex:1}.fullscreen object{width:100%;height:100%;border:1px solid var(--line);background:#222}.toast{position:fixed;right:20px;bottom:20px;background:#241a16;border:1px solid #8d6836;color:#fff0d3;padding:10px 14px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s;z-index:100}.toast.show{opacity:1;transform:none}@media(max-width:1050px){.workspace{grid-template-columns:400px minmax(0,1fr)}.pdf-grid{--cols:1!important}}@media(max-width:760px){.topbar{height:auto;min-height:70px;padding:11px 14px}.brand p,.save-state{display:none}.workspace{display:block}.encounter{border-right:0;border-bottom:1px solid var(--line);padding:12px}.statblocks{padding:12px}.add-form{grid-template-columns:1fr 1fr}.add-form .field:first-child{grid-column:1/-1}.add-form>.btn{width:100%}.slots{grid-template-columns:repeat(2,1fr)}.pdf-grid{grid-template-columns:1fr}.pdf-frame{height:72vh}.back{font-size:0}.back:after{content:"←";font-size:18px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back" href="./">← ALL GAMES</a>
    <div class="brand-mark">D20</div>
    <div class="brand"><h1>DND</h1><p>Encounter board & statblock library</p></div>
    <div class="top-actions"><span class="save-state">Saved on this device</span><button class="btn small" id="resetEncounter">New encounter</button></div>
  </header>
  <main class="workspace">
    <section class="encounter" aria-labelledby="initiativeTitle">
      <div class="section-head"><h2 id="initiativeTitle">Initiative Order</h2><span class="badge" id="countBadge">0 CREATURES</span></div>
      <form class="add-form panel" id="addCombatant">
        <div class="field"><label for="newName">Name</label><input id="newName" required maxlength="50" placeholder="Goblin captain"></div>
        <div class="field"><label for="newInit">Initiative</label><input id="newInit" required type="number" value="10"></div>
        <div class="field"><label for="newHp">Max HP</label><input id="newHp" required type="number" min="1" value="20"></div>
        <button class="btn primary" type="submit">Add</button>
      </form>
      <div class="turnbar"><button class="btn small" id="prevTurn">← Previous</button><div class="round" id="roundLabel">ROUND 1</div><button class="btn small" id="nextTurn">Next →</button></div>
      <div class="combatants" id="combatants"></div>
    </section>
    <section class="statblocks" aria-labelledby="statblockTitle">
      <div class="section-head"><h2 id="statblockTitle">Statblock Library</h2><span class="badge" id="pdfBadge">0 PDFS</span></div>
      <div class="pdf-toolbar panel">
        <label class="btn primary upload">Import PDFs<input id="pdfInput" type="file" accept="application/pdf,.pdf" multiple></label>
        <div class="dropzone" id="dropzone">Drop any number of PDF statblocks here</div>
        <div class="view-picks" aria-label="PDF columns"><button class="btn small" data-cols="1">1</button><button class="btn small on" data-cols="2">2</button><button class="btn small" data-cols="3">3</button></div>
      </div>
      <p id="importStatus" role="status" aria-live="polite">Books are scanned for individual statblocks. Review the detected boundaries before saving.</p>
      <button class="btn small" id="cancelImport" hidden>Cancel scan</button>
      <input class="resource-input" id="librarySearch" type="search" aria-label="Search statblocks" placeholder="Search creatures or PDF names" style="margin-bottom:12px">
      <div class="pdf-library" id="pdfLibrary"></div>
      <div class="pdf-grid" id="pdfGrid"></div>
    </section>
  </main>
</div>
<div class="fullscreen" id="fullscreen" hidden><div class="modal-head"><strong id="fullTitle"></strong><button class="btn" id="closeFull">Close</button></div><object id="fullPdf" type="application/pdf"></object></div>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2),STORE='dnd-encounter-v1';
let state={round:1,turn:0,columns:2,combatants:[]},pdfs=[],urls=new Map(),toastTimer=0;
function save(){localStorage.setItem(STORE,JSON.stringify(state));$('.save-state').textContent='Saved just now'}
function load(){try{const data=JSON.parse(localStorage.getItem(STORE));if(data&&Array.isArray(data.combatants))state={...state,...data}}catch{}state.combatants.forEach(c=>{c.slots=c.slots||Array.from({length:9},()=>({max:0,used:0}));c.abilities=c.abilities||[]})}
function esc(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function notice(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),1700)}
function sortCombatants(){const active=state.combatants[state.turn]?.id;state.combatants.sort((a,b)=>b.initiative-a.initiative||a.name.localeCompare(b.name));state.turn=Math.max(0,state.combatants.findIndex(c=>c.id===active));if(state.turn<0)state.turn=0}
function renderEncounter(){sortCombatants();$('#roundLabel').textContent='ROUND '+state.round;$('#countBadge').textContent=state.combatants.length+' '+(state.combatants.length===1?'CREATURE':'CREATURES');if(!state.combatants.length){$('#combatants').innerHTML='<div class="empty">Add a creature to begin the initiative order.</div>';return}$('#combatants').innerHTML=state.combatants.map((c,i)=>{const pct=Math.max(0,Math.min(100,c.hp/c.maxHp*100));return `<article class="combatant ${i===state.turn?'active':''}" data-id="${c.id}"><div class="combatant-main"><div class="init"><span>${c.initiative}</span></div><div class="who"><strong>${esc(c.name)}</strong>${i===state.turn?'<span class="turn-label">CURRENT TURN</span>':''}<div class="hp-line"><span class="hpbar"><i style="width:${pct}%"></i></span><span class="hptext">${c.hp} / ${c.maxHp} HP</span></div></div><div class="hp-actions"><input type="number" min="0" value="1" aria-label="HP amount"><button class="icon-btn" data-action="damage" title="Damage">−</button><button class="icon-btn" data-action="heal" title="Heal">+</button></div></div><div class="combatant-tools"><button data-action="resources">Resources</button><button data-action="edit">Edit</button><button data-action="remove">Remove</button></div><div class="resources" ${c.resourcesOpen?'':'hidden'}>${renderResources(c)}</div></article>`}).join('')}
function renderResources(c){const slots=c.slots.map((s,i)=>`<div class="slot-row"><label><span>LEVEL ${i+1}</span><span>${s.max-s.used}/${s.max}</span></label><div class="slot-pips">${Array.from({length:s.max},(_,p)=>`<button class="pip ${p<s.used?'used':''}" data-action="slot" data-level="${i}" data-pip="${p}" title="Level ${i+1} spell slot ${p+1}"></button>`).join('')}</div><input class="resource-input" data-action="slotmax" data-level="${i}" type="number" min="0" max="20" value="${s.max}" aria-label="Level ${i+1} maximum slots"></div>`).join('');const abilities=c.abilities.map(a=>`<div class="ability" data-ability="${a.id}"><span>${esc(a.name)}</span><b>${a.current}/${a.max}</b><button class="icon-btn" data-action="abilitydown">−</button><button class="icon-btn" data-action="abilityup">+</button></div>`).join('')||'<div class="empty" style="padding:10px">No ability counters yet.</div>';return `<h3>Spell slots</h3><div class="slots">${slots}</div><h3>Ability uses</h3><div class="ability-list">${abilities}</div><form class="ability-add"><input class="resource-input" name="abilityName" required maxlength="40" placeholder="Legendary resistance"><input class="resource-input" name="abilityMax" type="number" min="1" max="99" value="3"><button class="btn small">Add</button></form>`}
$('#addCombatant').onsubmit=e=>{e.preventDefault();const c={id:uid(),name:$('#newName').value.trim(),initiative:+$('#newInit').value||0,maxHp:Math.max(1,+$('#newHp').value||1),hp:Math.max(1,+$('#newHp').value||1),resourcesOpen:false,slots:Array.from({length:9},()=>({max:0,used:0})),abilities:[]};state.combatants.push(c);sortCombatants();state.turn=state.combatants.findIndex(x=>x.id===c.id);save();renderEncounter();e.target.reset();$('#newInit').value=10;$('#newHp').value=20;$('#newName').focus()};
$('#combatants').onclick=e=>{const card=e.target.closest('.combatant');if(!card)return;const c=state.combatants.find(x=>x.id===card.dataset.id),action=e.target.dataset.action;if(!c||!action)return;if(action==='damage'||action==='heal'){const amount=Math.max(0,+card.querySelector('.hp-actions input').value||0);c.hp=Math.max(0,Math.min(c.maxHp,c.hp+(action==='heal'?amount:-amount)))}else if(action==='resources')c.resourcesOpen=!c.resourcesOpen;else if(action==='remove'){if(!confirm(`Remove ${c.name} from the encounter?`))return;state.combatants=state.combatants.filter(x=>x.id!==c.id);state.turn=Math.min(state.turn,Math.max(0,state.combatants.length-1))}else if(action==='edit'){const name=prompt('Name',c.name),initiative=prompt('Initiative',c.initiative),maxHp=prompt('Maximum HP',c.maxHp);if(name?.trim())c.name=name.trim();if(initiative!==null)c.initiative=+initiative||0;if(maxHp!==null){c.maxHp=Math.max(1,+maxHp||1);c.hp=Math.min(c.hp,c.maxHp)}}else if(action==='slot'){const s=c.slots[+e.target.dataset.level],p=+e.target.dataset.pip;s.used=p<s.used?p:p+1}else if(action==='abilitydown'||action==='abilityup'){const a=c.abilities.find(x=>x.id===e.target.closest('.ability').dataset.ability);a.current=Math.max(0,Math.min(a.max,a.current+(action==='abilityup'?1:-1)))}save();renderEncounter()};
$('#combatants').onchange=e=>{if(e.target.dataset.action!=='slotmax')return;const card=e.target.closest('.combatant'),c=state.combatants.find(x=>x.id===card.dataset.id),s=c.slots[+e.target.dataset.level];s.max=Math.max(0,Math.min(20,+e.target.value||0));s.used=Math.min(s.used,s.max);save();renderEncounter()};
$('#combatants').onsubmit=e=>{if(!e.target.matches('.ability-add'))return;e.preventDefault();const card=e.target.closest('.combatant'),c=state.combatants.find(x=>x.id===card.dataset.id),data=new FormData(e.target),max=Math.max(1,+data.get('abilityMax')||1);c.abilities.push({id:uid(),name:String(data.get('abilityName')).trim(),max,current:max});save();renderEncounter()};
$('#nextTurn').onclick=()=>{if(!state.combatants.length)return;state.turn++;if(state.turn>=state.combatants.length){state.turn=0;state.round++}save();renderEncounter()};$('#prevTurn').onclick=()=>{if(!state.combatants.length)return;state.turn--;if(state.turn<0){state.turn=state.combatants.length-1;state.round=Math.max(1,state.round-1)}save();renderEncounter()};
$('#resetEncounter').onclick=()=>{if(!confirm('Clear initiative, HP, spell slots, and ability uses? Imported PDFs will stay in your library.'))return;state={...state,round:1,turn:0,combatants:[]};save();renderEncounter();notice('New encounter ready')};
function openDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open('dnd-pdf-library',1);req.onupgradeneeded=()=>req.result.createObjectStore('pdfs',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function dbAll(){const db=await openDb();return new Promise((resolve,reject)=>{const req=db.transaction('pdfs').objectStore('pdfs').getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function dbPut(item){return dbPutMany([item])}
async function dbPutMany(items){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction('pdfs','readwrite');tx.oncomplete=()=>{db.close();resolve()};tx.onerror=tx.onabort=()=>{db.close();reject(tx.error||new Error('Storage was interrupted'))};for(const item of items)tx.objectStore('pdfs').put(item)})}
async function dbDelete(id){const db=await openDb();return new Promise((resolve,reject)=>{const req=db.transaction('pdfs','readwrite').objectStore('pdfs').delete(id);req.onsuccess=()=>resolve();req.onerror=()=>reject(req.error)})}
function pdfUrl(p){if(!urls.has(p.id))urls.set(p.id,URL.createObjectURL(p.file));return urls.get(p.id)}
function renderPdfs(){document.documentElement.style.setProperty('--cols',state.columns);$('#pdfBadge').textContent=pdfs.length+' '+(pdfs.length===1?'PDF':'PDFS');document.querySelectorAll('[data-cols]').forEach(b=>b.classList.toggle('on',+b.dataset.cols===state.columns));$('#pdfLibrary').innerHTML=pdfs.map(p=>`<div class="pdf-chip ${p.open?'open':''}" data-pdf="${p.id}"><span>${esc(p.name)}</span><button data-action="toggle" title="${p.open?'Close':'Open'}">${p.open?'◉':'○'}</button><button data-action="delete" title="Delete">×</button></div>`).join('');$('#pdfGrid').innerHTML=pdfs.filter(p=>p.open).map(p=>`<article class="pdf-card" data-pdf="${p.id}"><div class="pdf-card-head"><strong>${esc(p.name)}</strong><button class="btn small" data-action="full">Expand</button><button class="btn small" data-action="toggle">Close</button></div><object class="pdf-frame" data="${pdfUrl(p)}#view=FitH" type="application/pdf"><p>PDF preview unavailable. <a href="${pdfUrl(p)}" target="_blank">Open ${esc(p.name)}</a></p></object></article>`).join('')||'<div class="empty">Import a PDF, then open as many statblocks as you need.</div>'}
async function importPdfs(files){return window.statblockImporter.importFiles(files)}
$('#pdfInput').onchange=e=>{importPdfs(e.target.files);e.target.value=''};const drop=$('#dropzone');['dragenter','dragover'].forEach(type=>drop.addEventListener(type,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(type=>drop.addEventListener(type,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>importPdfs(e.dataTransfer.files));
document.querySelector('.view-picks').onclick=e=>{const b=e.target.closest('[data-cols]');if(!b)return;state.columns=+b.dataset.cols;save();renderPdfs()};
async function pdfAction(e){const el=e.target.closest('[data-action]'),holder=e.target.closest('[data-pdf]');if(!el||!holder)return;const p=pdfs.find(x=>x.id===holder.dataset.pdf);if(!p)return;if(el.dataset.action==='toggle'){p.open=!p.open;renderPdfs()}else if(el.dataset.action==='full'){$('#fullTitle').textContent=p.name;$('#fullPdf').data=pdfUrl(p)+'#view=FitH';$('#fullscreen').hidden=false}else if(el.dataset.action==='delete'){if(!confirm(`Remove ${p.name} from this device?`))return;URL.revokeObjectURL(urls.get(p.id));urls.delete(p.id);await dbDelete(p.id);pdfs=pdfs.filter(x=>x.id!==p.id);renderPdfs()}}
$('#pdfLibrary').onclick=pdfAction;$('#pdfGrid').onclick=pdfAction;$('#closeFull').onclick=()=>{$('#fullscreen').hidden=true;$('#fullPdf').removeAttribute('data')};addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#fullscreen').hidden)$('#closeFull').click()});
async function init(){load();renderEncounter();try{const records=await dbAll();window.statblockImporter.setSources(records.filter(p=>p.kind==='source'));pdfs=records.filter(p=>p.kind!=='source').sort((a,b)=>a.created-b.created);renderPdfs()}catch{$('#pdfGrid').innerHTML='<div class="empty">PDF storage is unavailable in this browser.</div>'}}
</script>
<script src="dnd-importer.js"></script>
<script>init();</script>
</body>
</html>
