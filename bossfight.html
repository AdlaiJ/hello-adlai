<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adlai's Boss Fight</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10131e;color:#fff;font:16px system-ui,sans-serif}main{max-width:900px;padding:20px;text-align:center}h1{margin:0 0 6px;color:#ffdc64}p{margin:0 0 14px;color:#c8cbe0}canvas{width:min(840px,94vw);height:auto;border:3px solid #5563b6;background:#262b3e;box-shadow:0 16px 45px #0008;outline:none}.tips{margin:12px auto 0;line-height:1.7;color:#d9dcf1}.back{display:inline-block;margin-top:12px;color:#fff;background:#5968d9;padding:9px 14px;border-radius:8px;text-decoration:none;font-weight:700}
</style></head>
<body><main><h1>Neon Alley Boss Fight</h1><p>Defeat the alley boss with whatever you have.</p><canvas id="game" width="840" height="520" tabindex="0"></canvas><div class="tips"><b>WASD</b> move · <b>1</b> sword · <b>2</b> gun · <b>3</b> grenade · <b>Click</b> attack · <b>R</b> restart</div><a class="back" href="./">Back to Tetris</a></main>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),keys={},W=c.width,H=c.height;
let player,boss,shots,enemyShots,grenades,bursts,last,over;
function reset(){player={x:150,y:H/2,hp:80,face:0,cd:0,slash:0,grenade:0,weapon:'sword'};boss={x:660,y:H/2,hp:520,shield:140,shieldMax:140,cd:0,wave:2,flash:0};shots=[];enemyShots=[];grenades=[];bursts=[];over='';}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function shoot(){if(player.cd>0||over)return;const a=Math.atan2(boss.y-player.y,boss.x-player.x);shots.push({x:player.x,y:player.y,a,life:1});player.cd=.18;}
function sword(){if(player.slash>0||over)return;player.slash=.22;player.face=Math.atan2(boss.y-player.y,boss.x-player.x);if(dist(player,boss)<110){hurtBoss(32);}}
function hurtBoss(amount){if(boss.shield>0){boss.shield=Math.max(0,boss.shield-amount);boss.flash=.15;return;}boss.hp-=amount;boss.flash=.15;}
function grenade(){if(player.grenade>0||over)return;const a=Math.atan2(boss.y-player.y,boss.x-player.x);grenades.push({x:player.x,y:player.y,vx:Math.cos(a)*260,vy:Math.sin(a)*260,t:.75});player.grenade=1.3;}
addEventListener('keydown',e=>{if(['w','a','s','d','1','2','3','r'].includes(e.key.toLowerCase()))e.preventDefault();keys[e.key.toLowerCase()]=true;if(e.key==='1')player.weapon='sword';if(e.key==='2')player.weapon='gun';if(e.key==='3')player.weapon='grenade';if(e.key.toLowerCase()==='r')reset();});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);c.addEventListener('click',()=>{c.focus();if(player.weapon==='sword')sword();else if(player.weapon==='gun')shoot();else grenade();});
function update(dt){if(over)return;let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);if(dx||dy){const n=Math.hypot(dx,dy);player.x=clamp(player.x+dx/n*220*dt,26,W-26);player.y=clamp(player.y+dy/n*220*dt,26,H-26);}player.cd-=dt;player.slash-=dt;player.grenade-=dt;boss.cd-=dt;boss.wave-=dt;boss.flash-=dt;boss.shield=Math.min(boss.shieldMax,boss.shield+7*dt);if(boss.cd<=0){const a=Math.atan2(player.y-boss.y,player.x-boss.x);enemyShots.push({x:boss.x,y:boss.y,vx:Math.cos(a)*230,vy:Math.sin(a)*230});boss.cd=.42;}if(boss.wave<=0){for(let i=0;i<18;i++){const a=i*Math.PI*2/18;enemyShots.push({x:boss.x,y:boss.y,vx:Math.cos(a)*175,vy:Math.sin(a)*175});}boss.wave=2.8;boss.flash=.25;}shots=shots.filter(s=>{s.x+=Math.cos(s.a)*540*dt;s.y+=Math.sin(s.a)*540*dt;s.life-=dt;if(dist(s,boss)<34){hurtBoss(13);return false}return s.life>0});enemyShots=enemyShots.filter(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;if(dist(s,player)<22){player.hp-=12;bursts.push({x:player.x,y:player.y,t:.3,color:'#ff6b6b'});return false}return s.x>0&&s.x<W&&s.y>0&&s.y<H});grenades=grenades.filter(g=>{g.x+=g.vx*dt;g.y+=g.vy*dt;g.vx*=.96;g.vy*=.96;g.t-=dt;if(g.t<=0){bursts.push({x:g.x,y:g.y,t:.5,color:'#ffb429'});if(Math.hypot(g.x-boss.x,g.y-boss.y)<135){hurtBoss(78);}return false}return true});bursts=bursts.filter(b=>(b.t-=dt)>0);if(boss.hp<=0)over='YOU WIN!';if(player.hp<=0)over='TRY AGAIN';}
function bar(x0,y0,w,v,max,color){x.fillStyle='#161a29';x.fillRect(x0,y0,w,12);x.fillStyle=color;x.fillRect(x0,y0,w*Math.max(0,v)/max,12);}
function draw(){x.fillStyle='#262b3e';x.fillRect(0,0,W,H);x.strokeStyle='#323951';x.lineWidth=1;for(let i=0;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=40){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}x.fillStyle='#171b29';x.fillRect(0,0,W,52);bar(24,20,230,player.hp,80,'#66dc91');bar(W-254,20,230,boss.hp,520,'#ff596d');bar(W-254,36,230,boss.shield,boss.shieldMax,'#5ce7ff');x.fillStyle='#fff';x.font='bold 14px system-ui';x.fillText('YOU',24,15);x.fillText('ALLEY BOSS',W-254,15);x.fillStyle='#d9dcf1';x.font='bold 15px system-ui';x.fillText('Weapon: '+player.weapon.toUpperCase(),W/2-60,35);for(const s of shots){x.fillStyle='#9aefff';x.beginPath();x.arc(s.x,s.y,5,0,7);x.fill()}for(const s of enemyShots){x.fillStyle='#ff6d7f';x.beginPath();x.arc(s.x,s.y,6,0,7);x.fill()}for(const g of grenades){x.fillStyle='#98d864';x.beginPath();x.arc(g.x,g.y,10,0,7);x.fill();x.fillStyle='#ddd';x.fillRect(g.x-2,g.y-13,4,7)}for(const b of bursts){x.globalAlpha=Math.max(0,b.t*2);x.strokeStyle=b.color;x.lineWidth=5;x.beginPath();x.arc(b.x,b.y,(.5-b.t)*100+18,0,7);x.stroke();x.globalAlpha=1}x.fillStyle='#57b7ff';x.beginPath();x.arc(player.x,player.y,18,0,7);x.fill();x.fillStyle='#151724';x.fillRect(player.x-7,player.y-5,14,10);if(player.slash>0){x.strokeStyle='#fff2a8';x.lineWidth=9;x.beginPath();x.arc(player.x,player.y,64,player.face-.7,player.face+.7);x.stroke()}if(boss.shield>0){x.strokeStyle='#5ce7ff';x.lineWidth=5;x.globalAlpha=.35+boss.shield/boss.shieldMax*.45;x.beginPath();x.arc(boss.x,boss.y,48,0,7);x.stroke();x.globalAlpha=1;}x.fillStyle=boss.flash>0?'#fff':'#e94e63';x.beginPath();x.arc(boss.x,boss.y,36,0,7);x.fill();x.fillStyle='#3e1720';x.fillRect(boss.x-17,boss.y-8,34,16);if(over){x.fillStyle='#000b';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='bold 54px system-ui';x.fillText(over,W/2,H/2);x.font='20px system-ui';x.fillText('Press R to play again',W/2,H/2+42);x.textAlign='left';}}
function loop(t){const dt=Math.min(.04,(t-last||0)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(()=>c.focus());requestAnimationFrame(loop);
</script></body></html>
