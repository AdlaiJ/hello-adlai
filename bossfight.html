<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adlai's Boss Fight</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10131e;color:#fff;font:16px system-ui,sans-serif}main{max-width:900px;padding:20px;text-align:center}h1{margin:0 0 6px;color:#ffdc64}p{margin:0 0 14px;color:#c8cbe0}canvas{width:min(840px,94vw);height:auto;border:3px solid #5563b6;background:#262b3e;box-shadow:0 16px 45px #0008;outline:none}.tips{margin:12px auto 0;line-height:1.7;color:#d9dcf1}.back{display:inline-block;margin-top:12px;color:#fff;background:#5968d9;padding:9px 14px;border-radius:8px;text-decoration:none;font-weight:700}
 #class-screen{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#080a12d9;padding:18px}#class-screen[hidden]{display:none}#class-screen section{max-width:720px;background:#171c32;border:1px solid #6574c9;border-radius:18px;padding:26px;text-align:center;box-shadow:0 18px 55px #000}#class-screen h2{margin:0;color:#ffdc64;font-size:2rem}#class-screen p{margin:8px 0 20px}.classes{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:12px}.classes button{background:#2b345a;padding:18px;text-align:left}.classes button:hover{background:#4a5ab0}.classes b,.classes span{display:block}.classes span{font-size:.85rem;color:#d9dcf1;margin-top:5px}@media(max-width:520px){.classes{grid-template-columns:1fr}}</style></head>
<body><div id="class-screen"><section><h2>Choose your class</h2><p>Pick a style before facing the boss.</p><div class="classes"><button data-class="swordfighter"><b>Swordfighter</b><span>Sword · dash · energy dash</span></button><button data-class="gunslinger"><b>Gunslinger</b><span>Gun · roll · bullet volley</span></button><button data-class="demolitionist"><b>Demolitionist</b><span>Grenades · blast dash · cluster bomb</span></button><button data-class="guardian"><b>Guardian</b><span>Hammer · guard · shockwave</span></button></div></section></div><main><h1>Neon Alley Boss Fight</h1><p>Defeat the alley boss with whatever you have.</p><canvas id="game" width="840" height="520" tabindex="0"></canvas><div class="tips"><b>WASD</b> move · <b>Click</b> main attack · <b>1</b> ability · <b>2</b> special · <b>R</b> restart</div><a class="back" href="./">Back to Tetris</a></main>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),keys={},W=c.width,H=c.height;
const classes={swordfighter:{name:'SWORD FIGHTER',hp:120},gunslinger:{name:'GUNSLINGER',hp:82},demolitionist:{name:'DEMOLITIONIST',hp:100},guardian:{name:'GUARDIAN',hp:150}};let selectedClass='swordfighter';

let player,boss,shots,enemyShots,grenades,bursts,last,over;
function reset(){const cls=classes[selectedClass];player={x:150,y:H/2,hp:cls.hp,maxHp:cls.hp,face:0,cd:0,slash:0,grenade:0,energy:100,ability:0,special:0,guard:0};boss={x:660,y:H/2,hp:520,shields:[{hp:65},{hp:65},{hp:65}],respawn:15,spin:0,cd:0,wave:2,flash:0};shots=[];enemyShots=[];grenades=[];bursts=[];over='';}
function attack(){if(selectedClass==='swordfighter'||selectedClass==='guardian')sword();else if(selectedClass==='gunslinger')shoot();else grenade();}
function dash(power=false){if(player.ability>0||player.energy<(power?55:25)||over)return;let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);if(!dx&&!dy){dx=Math.cos(player.face);dy=Math.sin(player.face);}const n=Math.hypot(dx,dy);player.x=clamp(player.x+dx/n*(power?180:100),26,W-26);player.y=clamp(player.y+dy/n*(power?180:100),26,H-26);player.energy-=power?55:25;player.ability=power?.9:.55;if(power&&dist(player,boss)<150)hurtBoss(42);}
function ability(){if(selectedClass==='guardian'){if(player.energy<30||player.ability>0)return;player.energy-=30;player.guard=2.2;player.ability=.8;}else dash(false);}
function special(){if(player.special>0||over)return;if(selectedClass==='swordfighter'){dash(true);}else if(selectedClass==='gunslinger'){for(let i=-2;i<=2;i++){const a=Math.atan2(boss.y-player.y,boss.x-player.x)+i*.12;shots.push({x:player.x,y:player.y,a,life:1});}player.special=1.3;}else if(selectedClass==='demolitionist'){for(let i=-1;i<=1;i++){const a=Math.atan2(boss.y-player.y,boss.x-player.x)+i*.28;grenades.push({x:player.x,y:player.y,vx:Math.cos(a)*260,vy:Math.sin(a)*260,t:.65});}player.special=1.5;}else{if(player.energy<55)return;player.energy-=55;if(dist(player,boss)<170)hurtBoss(55);player.guard=1.4;player.special=1.5;}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function shieldPos(i){const a=boss.spin+i*Math.PI*2/3;return{x:boss.x+Math.cos(a)*66,y:boss.y+Math.sin(a)*66};}
function shoot(){if(player.cd>0||over)return;const a=Math.atan2(boss.y-player.y,boss.x-player.x);shots.push({x:player.x,y:player.y,a,life:1});player.cd=.42;}
function sword(){if(player.slash>0||over)return;player.slash=.42;player.face=Math.atan2(boss.y-player.y,boss.x-player.x);if(dist(player,boss)<110){hurtBoss(32);}}
function hurtBoss(amount){const shield=boss.shields.find(s=>s.hp>0);if(shield){shield.hp=Math.max(0,shield.hp-amount);boss.flash=.15;return;}boss.hp-=amount;boss.flash=.15;}
function grenade(){if(player.grenade>0||over)return;const a=Math.atan2(boss.y-player.y,boss.x-player.x);grenades.push({x:player.x,y:player.y,vx:Math.cos(a)*260,vy:Math.sin(a)*260,t:.75});player.grenade=2.1;}
addEventListener('keydown',e=>{if(['w','a','s','d','1','2','r'].includes(e.key.toLowerCase()))e.preventDefault();keys[e.key.toLowerCase()]=true;if(e.key==='1')ability();if(e.key==='2')special();if(e.key.toLowerCase()==='r')reset();});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);c.addEventListener('click',()=>{c.focus();attack();});
function update(dt){if(over)return;let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);if(dx||dy){const n=Math.hypot(dx,dy);player.x=clamp(player.x+dx/n*220*dt,26,W-26);player.y=clamp(player.y+dy/n*220*dt,26,H-26);}player.cd-=dt;player.slash-=dt;player.grenade-=dt;player.ability-=dt;player.special-=dt;player.guard-=dt;player.energy=Math.min(100,player.energy+18*dt);boss.cd-=dt;boss.wave-=dt;boss.flash-=dt;boss.spin+=dt*1.8;if(boss.shields.every(s=>s.hp<=0)){boss.respawn-=dt;if(boss.respawn<=0){boss.shields.forEach(s=>s.hp=65);boss.respawn=15;}}else boss.respawn=15;if(boss.cd<=0){const a=Math.atan2(player.y-boss.y,player.x-boss.x);enemyShots.push({x:boss.x,y:boss.y,vx:Math.cos(a)*230,vy:Math.sin(a)*230});boss.cd=.42;}if(boss.wave<=0){for(let i=0;i<18;i++){const a=i*Math.PI*2/18;enemyShots.push({x:boss.x,y:boss.y,vx:Math.cos(a)*175,vy:Math.sin(a)*175});}boss.wave=2.8;boss.flash=.25;}shots=shots.filter(s=>{s.x+=Math.cos(s.a)*540*dt;s.y+=Math.sin(s.a)*540*dt;s.life-=dt;for(let i=0;i<3;i++){const q=shieldPos(i);if(boss.shields[i].hp>0&&Math.hypot(s.x-q.x,s.y-q.y)<22){boss.shields[i].hp=Math.max(0,boss.shields[i].hp-13);boss.flash=.08;return false}}if(dist(s,boss)<34){hurtBoss(13);return false}return s.life>0});enemyShots=enemyShots.filter(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;if(dist(s,player)<22){player.hp-=player.guard>0?3:12;bursts.push({x:player.x,y:player.y,t:.3,color:'#ff6b6b'});return false}return s.x>0&&s.x<W&&s.y>0&&s.y<H});grenades=grenades.filter(g=>{g.x+=g.vx*dt;g.y+=g.vy*dt;g.vx*=.96;g.vy*=.96;g.t-=dt;if(g.t<=0){bursts.push({x:g.x,y:g.y,t:.5,color:'#ffb429'});if(Math.hypot(g.x-boss.x,g.y-boss.y)<135){hurtBoss(78);}return false}return true});bursts=bursts.filter(b=>(b.t-=dt)>0);if(boss.hp<=0)over='YOU WIN!';if(player.hp<=0)over='TRY AGAIN';}
function bar(x0,y0,w,v,max,color){x.fillStyle='#161a29';x.fillRect(x0,y0,w,12);x.fillStyle=color;x.fillRect(x0,y0,w*Math.max(0,v)/max,12);}
function draw(){x.fillStyle='#262b3e';x.fillRect(0,0,W,H);x.strokeStyle='#323951';x.lineWidth=1;for(let i=0;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=40){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}x.fillStyle='#171b29';x.fillRect(0,0,W,52);bar(24,20,230,player.hp,player.maxHp,'#66dc91');bar(24,36,230,player.energy,100,'#ffcf58');bar(W-254,20,230,boss.hp,520,'#ff596d');x.fillStyle='#fff';x.font='bold 14px system-ui';x.fillText('YOU',24,15);x.fillText('ALLEY BOSS',W-254,15);x.fillStyle='#d9dcf1';x.font='bold 15px system-ui';x.fillText('Class: '+classes[selectedClass].name,W/2-70,35);if(boss.shields.every(s=>s.hp<=0))x.fillText('Shields rebuild: '+Math.ceil(boss.respawn),W/2-70,52);for(const s of shots){x.fillStyle='#9aefff';x.beginPath();x.arc(s.x,s.y,5,0,7);x.fill()}for(const s of enemyShots){x.fillStyle='#ff6d7f';x.beginPath();x.arc(s.x,s.y,6,0,7);x.fill()}for(const g of grenades){x.fillStyle='#98d864';x.beginPath();x.arc(g.x,g.y,10,0,7);x.fill();x.fillStyle='#ddd';x.fillRect(g.x-2,g.y-13,4,7)}for(const b of bursts){x.globalAlpha=Math.max(0,b.t*2);x.strokeStyle=b.color;x.lineWidth=5;x.beginPath();x.arc(b.x,b.y,(.5-b.t)*100+18,0,7);x.stroke();x.globalAlpha=1}x.fillStyle='#57b7ff';x.beginPath();x.arc(player.x,player.y,18,0,7);x.fill();x.fillStyle='#151724';x.fillRect(player.x-7,player.y-5,14,10);if(player.slash>0){x.strokeStyle='#fff2a8';x.lineWidth=9;x.beginPath();x.arc(player.x,player.y,64,player.face-.7,player.face+.7);x.stroke()}for(let i=0;i<3;i++){const s=boss.shields[i],q=shieldPos(i);if(s.hp>0){x.fillStyle='#5ce7ff';x.beginPath();x.arc(q.x,q.y,16,0,7);x.fill();x.fillStyle='#152238';x.fillRect(q.x-15,q.y-25,30,5);x.fillStyle='#d9ffff';x.fillRect(q.x-15,q.y-25,30*s.hp/65,5);}}x.fillStyle=boss.flash>0?'#fff':'#e94e63';x.beginPath();x.arc(boss.x,boss.y,36,0,7);x.fill();x.fillStyle='#3e1720';x.fillRect(boss.x-17,boss.y-8,34,16);if(over){x.fillStyle='#000b';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='bold 54px system-ui';x.fillText(over,W/2,H/2);x.font='20px system-ui';x.fillText('Press R to play again',W/2,H/2+42);x.textAlign='left';}}
function loop(t){const dt=Math.min(.04,(t-last||0)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}document.querySelectorAll('[data-class]').forEach(button=>button.onclick=()=>{selectedClass=button.dataset.class;reset();document.querySelector('#class-screen').setAttribute('hidden','');c.focus();});reset();requestAnimationFrame(()=>c.focus());requestAnimationFrame(loop);
</script></body></html>
