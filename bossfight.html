<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adlai's Boss Fight</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10131e;color:#fff;font:16px system-ui,sans-serif}main{max-width:900px;padding:20px;text-align:center}h1{margin:0 0 6px;color:#ffdc64}p{margin:0 0 14px;color:#c8cbe0}canvas{width:min(840px,94vw);height:auto;border:3px solid #5563b6;background:#262b3e;box-shadow:0 16px 45px #0008;outline:none}.tips{margin:12px auto 0;line-height:1.7;color:#d9dcf1}.back{display:inline-block;margin-top:12px;color:#fff;background:#5968d9;padding:9px 14px;border-radius:8px;text-decoration:none;font-weight:700}
 #class-screen{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#080a12d9;padding:18px}#class-screen[hidden]{display:none}#class-screen section{max-width:720px;background:#171c32;border:1px solid #6574c9;border-radius:18px;padding:26px;text-align:center;box-shadow:0 18px 55px #000}#class-screen h2{margin:0;color:#ffdc64;font-size:2rem}#class-screen p{margin:8px 0 20px}.boss-pick{display:block;margin:0 auto 16px;font-weight:700}.boss-pick select{margin-left:8px;padding:7px;border-radius:6px;background:#252c4a;color:#fff;border:1px solid #6574c9}.classes{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:12px}.classes button{background:#2b345a;padding:18px;text-align:left}.classes button:hover{background:#4a5ab0}.classes b,.classes span{display:block}.classes span{font-size:.85rem;color:#d9dcf1;margin-top:5px}@media(max-width:520px){.classes{grid-template-columns:1fr}}</style></head>
<body><div id="class-screen"><section><h2>Choose your class</h2><p>Pick a class and choose your opponent.</p><label class="boss-pick">Boss <select id="boss-select"><option value="enforcer">Street Enforcer — easier</option><option value="alley" selected>Alley Boss — standard</option><option value="warden">Iron Warden — hard</option><option value="reaper">Neon Reaper — hard</option><option value="void">Void Overlord — super difficult</option><option value="frost">Frost Revenant — ice barrages</option><option value="storm">Storm Herald — lightning traps</option><option value="titan">Chrome Titan — crushing shockwaves</option><option value="squad">Rooftop Rascals — four weaker fighters</option></select></label><div class="classes"><button type="button" data-class="swordfighter" onclick="chooseClass('swordfighter')"><b>Swordfighter</b><span>Sword · dash · energy dash</span></button><button type="button" data-class="gunslinger" onclick="chooseClass('gunslinger')"><b>Gunslinger</b><span>Gun · roll · bullet volley</span></button><button type="button" data-class="demolitionist" onclick="chooseClass('demolitionist')"><b>Demolitionist</b><span>Grenades · blast dash · cluster bomb</span></button><button type="button" data-class="guardian" onclick="chooseClass('guardian')"><b>Guardian</b><span>Hammer · guard · shockwave</span></button><button type="button" onclick="chooseClass('ranger')"><b>Ranger</b><span>Rail arrow · snare trap · arrow rain</span></button><button type="button" onclick="chooseClass('arcane')"><b>Arcanist</b><span>Seeking orb · phase blink · singularity</span></button><button type="button" onclick="chooseClass('ninja')"><b>Ninja</b><span>Shuriken · shadow strike · mirror squad</span></button><button type="button" onclick="chooseClass('medic')"><b>Medic</b><span>Pulse · heal sprint · recovery burst</span></button><button type="button" onclick="chooseClass('bruiser')"><b>Bruiser</b><span>Combo fists · iron rush · rage quake</span></button><button type="button" onclick="chooseClass('engineer')"><b>Engineer</b><span>Energy spike · build wall · combat drone</span></button></div></section></div><main><h1>Neon Alley Boss Fight</h1><p>Defeat the alley boss with whatever you have.</p><canvas id="game" width="840" height="520" tabindex="0"></canvas><div class="tips"><b>WASD</b> move · <b>Click</b> main attack · <b>1</b> ability · <b>2</b> special · <b>R</b> restart</div><a class="back" href="./">Back to Tetris</a></main>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),keys={},W=c.width,H=c.height;
const bosses={alley:{name:'ALLEY BOSS',hp:520,shield:65,fireCd:.42,bulletSpeed:230,waveCount:18,waveSpeed:175,waveCd:2.8,respawn:15},enforcer:{name:'STREET ENFORCER',hp:360,shield:40,fireCd:.7,bulletSpeed:160,waveCount:10,waveSpeed:125,waveCd:4,respawn:18},warden:{name:'IRON WARDEN',hp:720,shield:82,fireCd:.32,bulletSpeed:265,waveCount:24,waveSpeed:205,waveCd:2.3,respawn:13},reaper:{name:'NEON REAPER',hp:850,shield:95,fireCd:.27,bulletSpeed:290,waveCount:28,waveSpeed:225,waveCd:2,respawn:12},void:{name:'VOID OVERLORD',hp:1200,shield:125,fireCd:.45,bulletSpeed:275,waveCount:18,waveSpeed:210,waveCd:3.2,respawn:10},frost:{name:'FROST REVENANT',hp:630,shield:72,fireCd:.5,bulletSpeed:180,waveCount:12,waveSpeed:135,waveCd:3.1,respawn:14},storm:{name:'STORM HERALD',hp:760,shield:80,fireCd:.38,bulletSpeed:245,waveCount:16,waveSpeed:175,waveCd:2.6,respawn:13},titan:{name:'CHROME TITAN',hp:980,shield:110,fireCd:.62,bulletSpeed:155,waveCount:10,waveSpeed:145,waveCd:3.6,respawn:11},squad:{name:'ROOFTOP RASCALS',hp:560,shield:36,fireCd:.55,bulletSpeed:170,waveCount:8,waveSpeed:150,waveCd:3.4,respawn:16}};let selectedBoss='alley';
const classes={swordfighter:{name:'SWORD FIGHTER',hp:135},gunslinger:{name:'GUNSLINGER',hp:82},demolitionist:{name:'DEMOLITIONIST',hp:100},guardian:{name:'GUARDIAN',hp:150},ranger:{name:'RANGER',hp:94},arcane:{name:'ARCANIST',hp:88},ninja:{name:'NINJA',hp:90},medic:{name:'MEDIC',hp:112},bruiser:{name:'BRUISER',hp:158},engineer:{name:'ENGINEER',hp:108}};let selectedClass='swordfighter';
































let player,boss,shots,enemyShots,grenades,bursts,impacts,energySlashes,waves,healingZones,walls,drones,traps,fields,clones,last,over;
function reset(){const cls=classes[selectedClass],type=bosses[selectedBoss];player={x:150,y:H/2,hp:cls.hp,maxHp:cls.hp,face:0,cd:0,slash:0,grenade:0,energy:100,ability:0,special:0,guard:0,force:0,roll:0,swordRush:0,combo:0,comboTime:0,rage:0};boss={x:660,y:H/2,hp:type.hp,maxHp:type.hp,shields:[{hp:type.shield},{hp:type.shield},{hp:type.shield}],shieldValue:type.shield,respawn:type.respawn,respawnTime:type.respawn,spin:0,cd:0,wave:2,flash:0,type,special:3,charge:0,laser:0,beamClock:0,laserHit:0,orbit:0,voidHit:0,chargeHit:0};shots=[];enemyShots=[];grenades=[];bursts=[];impacts=[];energySlashes=[];waves=[];healingZones=[];walls=[];drones=[];traps=[];fields=[];clones=[];over='';}
function attack(){if(selectedClass==='swordfighter')sword();else if(selectedClass==='guardian')guardianImpact();else if(selectedClass==='bruiser')bruiserPunch();else if(selectedClass==='medic')medicPulse();else if(selectedClass==='engineer')engineerSpike();else shoot();}
function guardianImpact(){if(player.cd>0||over)return;const p={x:player.x+Math.cos(player.face)*65,y:player.y+Math.sin(player.face)*65,t:.28};impacts.push(p);player.cd=.55;if(Math.hypot(p.x-boss.x,p.y-boss.y)<100)hurtBoss(50);}
function bruiserPunch(){if(player.cd>0||over)return;player.combo=player.comboTime>0?(player.combo%3)+1:1;player.comboTime=.9;player.cd=player.rage>0?.2:.32;const reach=72+player.combo*8,p={x:player.x+Math.cos(player.face)*reach,y:player.y+Math.sin(player.face)*reach,t:.24};impacts.push(p);if(Math.hypot(p.x-boss.x,p.y-boss.y)<92)hurtBoss((18+player.combo*10)*(player.rage>0?1.35:1));}
function engineerSpike(){if(player.cd>0||over)return;const a=Math.atan2(boss.y-player.y,boss.x-player.x);shots.push({x:player.x,y:player.y,a,life:1.35,speed:430,damage:31,shieldDamage:24,color:'#58f7ff',size:9,spike:true});player.cd=.38;}
function medicPulse(){if(player.cd>0||over)return;player.cd=.48;player.hp=Math.min(player.maxHp,player.hp+3);bursts.push({x:player.x,y:player.y,t:.28,color:"#7dffaf"});if(dist(player,boss)<145)hurtBoss(18);}
function energySlash(){if(player.special>0||over||player.energy<34)return;player.energy-=34;player.face=Math.atan2(boss.y-player.y,boss.x-player.x);energySlashes.push({x:player.x,y:player.y,a:player.face,d:0,hit:false,cuts:0});player.special=1.1;}
































function dash(distance,cost){if(player.ability>0||player.energy<cost||over)return false;let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);if(!dx&&!dy){dx=Math.cos(player.face);dy=Math.sin(player.face);}const n=Math.hypot(dx,dy);player.x=clamp(player.x+dx/n*distance,26,W-26);player.y=clamp(player.y+dy/n*distance,26,H-26);player.energy-=cost;player.ability=.6;return true;}
function ability(){if(selectedClass==='swordfighter'){if(dash(58,35)){player.swordRush=.35;if(dist(player,boss)<125)hurtBoss(26);}}else if(selectedClass==='gunslinger'){if(dash(60,46))player.roll=.55;}else if(selectedClass==='demolitionist'){if(dash(42,52)){bursts.push({x:player.x,y:player.y,t:.35,color:'#ffb429'});if(dist(player,boss)<105)hurtBoss(18);}}else if(selectedClass==='ranger'){if(player.energy<30||player.ability>0)return;player.energy-=30;traps.push({x:player.x,y:player.y,t:9,kind:'snare'});player.ability=.9;}else if(selectedClass==='arcane'){if(dash(105,38)){player.roll=.5;bursts.push({x:player.x,y:player.y,t:.45,color:'#a884ff'});if(dist(player,boss)<105)hurtBoss(24);}}else if(selectedClass==='ninja'){if(player.energy<36||player.ability>0)return;player.energy-=36;const a=Math.atan2(boss.y-player.y,boss.x-player.x);player.x=clamp(boss.x+Math.cos(a)*-85,26,W-26);player.y=clamp(boss.y+Math.sin(a)*-85,26,H-26);player.roll=.75;player.ability=.8;bursts.push({x:boss.x,y:boss.y,t:.35,color:'#ff78df'});hurtBoss(38);}else if(selectedClass==='medic'){if(player.energy<35||player.ability>0)return;player.energy-=35;const a=Math.atan2(boss.y-player.y,boss.x-player.x);shots.push({x:player.x,y:player.y,a,life:1,medic:true});player.ability=1;}else if(selectedClass==='bruiser'){if(player.energy<42||player.ability>0)return;player.energy-=42;const a=Math.atan2(boss.y-player.y,boss.x-player.x);player.x=clamp(player.x+Math.cos(a)*105,26,W-26);player.y=clamp(player.y+Math.sin(a)*105,26,H-26);player.roll=.45;player.ability=.8;bursts.push({x:player.x,y:player.y,t:.4,color:'#ffb05c'});if(dist(player,boss)<145)hurtBoss(44);}else if(selectedClass==='engineer'){if(player.energy<32||player.ability>0)return;player.energy-=32;const wx=clamp(player.x+Math.cos(player.face)*70,35,W-35),wy=clamp(player.y+Math.sin(player.face)*70,75,H-75);walls.push({x:wx,y:wy,t:10,hp:100,maxHp:100,a:player.face});player.ability=.75;}else{if(player.energy<55||player.ability>0)return;player.energy-=55;player.force=2.7;player.ability=.9;}}
function special(){if(player.special>0||over)return;if(selectedClass==='swordfighter'){energySlash();}else if(selectedClass==='gunslinger'){if(player.energy<52)return;player.energy-=52;for(let i=-2;i<=2;i++){const a=Math.atan2(boss.y-player.y,boss.x-player.x)+i*.12;shots.push({x:player.x,y:player.y,a,life:1});}player.special=1.3;}else if(selectedClass==='demolitionist'){for(let i=-1;i<=1;i++){const a=Math.atan2(boss.y-player.y,boss.x-player.x)+i*.28;grenades.push({x:player.x,y:player.y,vx:Math.cos(a)*260,vy:Math.sin(a)*260,t:.65});}player.special=1.5;}else if(selectedClass==='ranger'){if(player.energy<54)return;player.energy-=54;fields.push({x:boss.x,y:boss.y,t:5,tick:0,kind:'rain',r:125});player.special=1.4;}else if(selectedClass==='arcane'){if(player.energy<62)return;player.energy-=62;fields.push({x:boss.x,y:boss.y,t:5.5,tick:0,kind:'singularity',r:115});player.special=1.6;}else if(selectedClass==='ninja'){if(player.energy<56)return;player.energy-=56;clones=[0,1,2].map(i=>({a:i*Math.PI*2/3,t:8,cd:i*.18}));player.special=1.5;}else if(selectedClass==='medic'){if(player.energy<55)return;player.energy-=55;const a=Math.atan2(boss.y-player.y,boss.x-player.x);grenades.push({x:player.x,y:player.y,vx:Math.cos(a)*210,vy:Math.sin(a)*210,t:.7,medicPotion:true});player.special=1.5;}else if(selectedClass==='bruiser'){if(player.energy<66)return;player.energy-=66;player.rage=6;waves.push({x:player.x,y:player.y,r:0,hit:false,t:1.15,damage:72,color:'#ff8b4b'});player.special=1.8;}else if(selectedClass==='engineer'){if(player.energy<58)return;player.energy-=58;drones.push({x:player.x,y:player.y-48,t:12,cd:0,a:0});player.special=1.5;}else{if(player.energy<70)return;player.energy-=70;waves.push({x:player.x,y:player.y,r:0,hit:false,t:.75});player.special=1.5;}}
function spawnBossShot(a){if(selectedBoss==='warden'){enemyShots.push({x:boss.x,y:boss.y,vx:0,vy:Math.sign(player.y-boss.y||1)*150,kind:'warden',age:0,telegraph:true});}else{enemyShots.push({x:boss.x,y:boss.y,vx:Math.cos(a)*boss.type.bulletSpeed,vy:Math.sin(a)*boss.type.bulletSpeed,kind:selectedBoss,age:0,a});}}
function drawEnemyShot(s){x.save();if(s.kind==='enforcer'||s.kind==='enforcerWave'){x.strokeStyle='#ff9b4b';x.lineWidth=6;x.beginPath();x.arc(s.x,s.y,9,.45,Math.PI*1.7);x.stroke();}else if(s.kind==='warden'||s.kind==='wardenWave'){x.fillStyle='#ffe36e';x.translate(s.x,s.y);x.rotate(Math.PI/4);x.fillRect(-7,-7,14,14);x.fillStyle='#ffffff';x.fillRect(-2,-2,4,4);}else if(s.kind==='reaper'||s.kind==='reaperWave'){x.fillStyle='#d87cff';x.translate(s.x,s.y);x.rotate((s.age||0)*6);x.fillRect(-10,-3,20,6);x.fillStyle='#fff';x.fillRect(-3,-8,6,16);}else if(s.kind==='void'||s.kind==='voidWave'){x.fillStyle='#29144f';x.beginPath();x.arc(s.x,s.y,11,0,7);x.fill();x.strokeStyle='#b48cff';x.lineWidth=3;x.stroke();}else if(s.kind==='frost'||s.kind==='frostWave'){x.fillStyle='#b7f6ff';x.rotate((s.age||0)*3);x.fillRect(-7,-7,14,14);}else if(s.kind==='storm'||s.kind==='stormWave'){x.strokeStyle='#fff08a';x.lineWidth=4;x.beginPath();x.moveTo(s.x-8,s.y-10);x.lineTo(s.x+2,s.y);x.lineTo(s.x-5,s.y+10);x.stroke();}else if(s.kind==='titan'||s.kind==='titanWave'){x.fillStyle='#aeb7c5';x.fillRect(s.x-9,s.y-9,18,18);}else if(s.kind==='squad'||s.kind==='squadWave'){x.fillStyle='#ff81b5';x.beginPath();x.arc(s.x,s.y,7,0,7);x.fill();}else{x.fillStyle='#ff6d7f';x.beginPath();x.arc(s.x,s.y,6,0,7);x.fill();}x.restore();}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function shieldPos(i){const a=boss.spin+i*Math.PI*2/3;return{x:boss.x+Math.cos(a)*72,y:boss.y+Math.sin(a)*72};}function angleGap(a,b){return Math.atan2(Math.sin(a-b),Math.cos(a-b));}function bulletHitsShield(s){const dx=s.x-boss.x,dy=s.y-boss.y,r=Math.hypot(dx,dy),a=Math.atan2(dy,dx);for(let i=0;i<3;i++){const center=boss.spin+i*Math.PI*2/3;if(boss.shields[i].hp>0&&r>44&&r<102&&Math.abs(angleGap(a,center))<.72){boss.shields[i].hp=Math.max(0,boss.shields[i].hp-(s.shieldDamage||13));boss.flash=.08;return true;}}return false;}
function shoot(){if(player.cd>0||over)return;const a=Math.atan2(boss.y-player.y,boss.x-player.x);if(selectedClass==='ranger'){shots.push({x:player.x,y:player.y,a,life:1.5,speed:720,damage:27,shieldDamage:18,color:'#b9ff7d',size:6});player.cd=.34;}else if(selectedClass==='arcane'){shots.push({x:player.x,y:player.y,a,life:1.8,speed:360,damage:23,homing:true,color:'#bd8cff',size:9});player.cd=.46;}else if(selectedClass==='ninja'){for(const d of[-.1,.1])shots.push({x:player.x,y:player.y,a:a+d,life:1.1,speed:610,damage:15,color:'#ff78df',size:5});player.cd=.28;}else{shots.push({x:player.x,y:player.y,a,life:1,damage:17});player.cd=.42;}}
function sword(){if(player.slash>0||over)return;player.slash=.42;player.face=Math.atan2(boss.y-player.y,boss.x-player.x);if(dist(player,boss)<110){hurtBoss(46);}}
function hurtBoss(amount){boss.hp-=amount;boss.flash=.15;}
function grenade(){if(player.grenade>0||over)return;const a=Math.atan2(boss.y-player.y,boss.x-player.x);grenades.push({x:player.x,y:player.y,vx:Math.cos(a)*260,vy:Math.sin(a)*260,t:.75});player.grenade=2.1;}
addEventListener('keydown',e=>{if(['w','a','s','d','1','2','r'].includes(e.key.toLowerCase()))e.preventDefault();keys[e.key.toLowerCase()]=true;if(e.key==='1')ability();if(e.key==='2')special();if(e.key.toLowerCase()==='r'){document.querySelector('#class-screen').removeAttribute('hidden');}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);c.addEventListener('click',e=>{const r=c.getBoundingClientRect();const px=(e.clientX-r.left)*c.width/r.width,py=(e.clientY-r.top)*c.height/r.height;player.face=Math.atan2(py-player.y,px-player.x);c.focus();attack();});
function update(dt){if(over)return;let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);if(dx||dy){const n=Math.hypot(dx,dy);player.x=clamp(player.x+dx/n*(player.rage>0?255:220)*dt,26,W-26);player.y=clamp(player.y+dy/n*(player.rage>0?255:220)*dt,26,H-26);}player.cd-=dt;player.slash-=dt;player.grenade-=dt;player.ability-=dt;player.special-=dt;player.guard-=dt;player.force-=dt;player.roll-=dt;player.swordRush-=dt;player.comboTime-=dt;player.rage-=dt;player.energy=Math.min(100,player.energy+8*dt);boss.cd-=dt;boss.wave-=dt;boss.flash-=dt;boss.chargeHit-=dt;boss.spin+=dt*1.8;if(boss.shields.every(s=>s.hp<=0)){boss.respawn-=dt;if(boss.respawn<=0){boss.shields.forEach(s=>s.hp=boss.shieldValue);boss.respawn=boss.respawnTime;}}else boss.respawn=boss.respawnTime;if(boss.cd<=0){const a=Math.atan2(player.y-boss.y,player.x-boss.x);spawnBossShot(a);boss.cd=boss.type.fireCd;}if(boss.wave<=0){for(let i=0;i<boss.type.waveCount;i++){const a=i*Math.PI*2/boss.type.waveCount;enemyShots.push({x:boss.x,y:boss.y,vx:Math.cos(a)*boss.type.waveSpeed,vy:Math.sin(a)*boss.type.waveSpeed,kind:selectedBoss+'Wave',age:0,a});}boss.wave=boss.type.waveCd;boss.flash=.25;}if(selectedBoss==='enforcer'){boss.charge-=dt;if(boss.charge<=0&&boss.special<=0){boss.charge=.7;boss.special=3.5;}if(boss.charge>0){const a=Math.atan2(player.y-boss.y,player.x-boss.x);boss.x=clamp(boss.x+Math.cos(a)*280*dt,80,W-80);boss.y=clamp(boss.y+Math.sin(a)*280*dt,80,H-80);if(dist(player,boss)<55&&boss.chargeHit<=0){player.hp-=10;boss.chargeHit=.8;}}}else if(selectedBoss==='warden'){boss.laser+=dt*1.45;boss.beamClock+=dt;boss.laserHit-=dt;boss.beamOn=Math.floor(boss.beamClock/1.5)%2===0;let near=false;for(let i=0;i<2;i++){const a=boss.laser+i*Math.PI/2,dx=player.x-boss.x,dy=player.y-boss.y;if(Math.abs(-Math.sin(a)*dx+Math.cos(a)*dy)<12&&Math.hypot(dx,dy)<430)near=true;}if(boss.beamOn&&near&&boss.laserHit<=0){player.hp-=9;boss.laserHit=.3;}}else if(selectedBoss==='reaper'){if(boss.special<=0){for(let i=0;i<14;i++){const .y)-w.r)<32){hurtBoss(w.damage||58);w.hit=true;}return w.t>0;});enemyShots=enemyShots.filter(s=>{s.age=(s.age||0)+dt;if(s.kind==='enforcer'||s.kind==='enforcerWave'){if(s.age>.55&&!s.returning){s.vx*=-.85;s.vy*=-.85;s.returning=true;}}if(s.kind==='warden'||s.kind==='wardenWave'){if(!s.turned){s.vy=Math.sign(player.y-s.y||1)*150;if(s.age>.9||Math.abs(player.y-s.y)<16){s.vx=Math.sign(player.x-s.x||1)*205;s.vy=0;s.turned=true;}}else if(s.age>3.5)return false;}if(s.kind==='reaper'||s.kind==='reaperWave'){const speed=Math.hypot(s.vx,s.vy),a=Math.atan2(s.vy,s.vx)+Math.sin(s.age*7)*.045;s.vx=Math.cos(a)*speed;s.vy=Math.sin(a)*speed;}if(s.kind==='void'||s.kind==='voidWave'){if(s.age>10)return false;const speed=Math.hypot(s.vx,s.vy),current=Math.atan2(s.vy,s.vx);if(s.age>(s.seekDelay??0)){const goal=Math.atan2(player.y-s.y,player.x-s.x),delta=Math.atan2(Math.sin(goal-current),Math.cos(goal-current)),a=current+delta*.065;s.vx=Math.cos(a)*speed;s.vy=Math.sin(a)*speed;}}s.x+=s.vx*dt;s.y+=s.vy*dt;const wall=walls.find(w=>{const dx=s.x-w.x,dy=s.y-w.y,lx=Math.cos(w.a)*dx+Math.sin(w.a)*dy,ly=-Math.sin(w.a)*dx+Math.cos(w.a)*dy;return Math.abs(lx)<14&&Math.abs(ly)<64;});if(wall){wall.hp-=12;bursts.push({x:s.x,y:s.y,t:.18,color:'#59f5ff'});return false;}if(fields.some(f=>f.kind==='singularity'&&Math.hypot(s.x-f.x,s.y-f.y)<f.r))return false;const dx=s.x-player.x,dy=s.y-player.y,ahead=dx*Math.cos(player.face)+dy*Math.sin(player.face);const blocked=player.force>0&&ahead>0&&Math.hypot(dx,dy)<120;const rushCut=player.swordRush>0&&Math.hypot(dx,dy)<95;const cutter=energySlashes.find(e=>Math.hypot(s.x-e.x,s.y-e.y)<26);const cut=Boolean(cutter);if(cutter)cutter.cuts++;const hitWave=waves.some(w=>Math.abs(Math.hypot(s.x-w.x,s.y-w.y)-w.r)<18);const hitImpact=impacts.some(p=>Math.hypot(s.x-p.x,s.y-p.y)<65);if(blocked||rushCut||cut||hitWave||hitImpact)return false;if(dist(s,player)<22){if(player.roll<=0)player.hp-=player.guard>0?3:(player.rage>0?7:12);bursts.push({x:player.x,y:player.y,t:.3,color function bar(x0,y0,w,v,max,color){x.fillStyle='#161a29';x.fillRect(x0,y0,w,12);x.fillStyle=color;x.fillRect(x0,y0,w*Math.max(0,v)/max,12);}
function draw(){x.fillStyle='#262b3e';x.fillRect(0,0,W,H);x.strokeStyle='#323951';x.lineWidth=1;for(let i=0;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=40){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}x.fillStyle='#171b29';x.fillRect(0,0,W,52);bar(24,20,230,player.hp,player.maxHp,'#66dc91');bar(24,36,230,player.energy,100,'#ffcf58');bar(W-254,20,230,boss.hp,boss.maxHp,'#ff596d');x.fillStyle='#fff';x.font='bold 14px system-ui';x.fillText('YOU',24,15);x.fillText(boss.type.name,W-254,15);x.fillStyle='#d9dcf1';x.font='bold 15px system-ui';x.fillText('Class: '+classes[selectedClass].name,W/2-70,35);if(boss.shields.every(s=>s.hp<=0))x.fillText('Shields rebuild: '+Math.ceil(boss.respawn),W/2-70,52);for(const s of shots){x.save();x.translate(s.x,s.y);x.rotate(s.a);x.fillStyle=s.color||'#9aefff';if(s.spike){x.beginPath();x.moveTo(15,0);x.lineTo(-10,-8);x.lineTo(-5,0);x.lineTo(-10,8);x.closePath();x.fill();x.strokeStyle='#d8ffff';x.lineWidth=2;x.stroke();}else{x.beginPath();x.arc(0,0,s.size||5,0,7);x.fill();}x.restore();}for(const s of enemyShots){drawEnemyShot(s);}for(const f of fields){x.save();x.globalAlpha=.18+.08*Math.sin(f.t*8);x.fillStyle=f.kind==='rain'?'#b9ff7d':'#9c62ff';x.beginPath();x.arc(f.x,f.y,f.r,0,7);x.fill();x.globalAlpha=.9;x.strokeStyle=f.kind==='rain'?'#dfffab':'#d8b8ff';x.lineWidth=3;x.stroke();if(f.kind==='rain'){x.fillStyle='#eaffca';for(let i=0;i<9;i++){const ax=f.x-90+i*22,ay=f.y-70+((i*31+f.t*80)%130);x.fillRect(ax,ay,3,18);}}x.restore();}for(const t of traps){x.save();x.translate(t.x,t.y);x.rotate(t.t*2);x.strokeStyle='#b9ff7d';x.lineWidth=4;x.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?12:24;x.lineTo(Math.cos(a)*r,Math.sin(a)*r);}x.closePath();x.stroke();x.restore();}for(const w of walls){x.save();x.translate(w.x,w.y);x.rotate(w.a);x.fillStyle='#173e55';x.fillRect(-12,-62,24,124);x.strokeStyle='#59f5ff';x.lineWidth=4;x.strokeRect(-12,-62,24,124);x.fillStyle='#bfffff';x.fillRect(-8,-54,1 36,0,7);x.fill();x.fillStyle='#3e1720';x.fillRect(boss.x-17,boss.y-8,34,16);if(over){x.fillStyle='#000b';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='bold 54px system-ui';x.fillText(over,W/2,H/2);x.font='20px system-ui';x.fillText('Press R to play again',W/2,H/2+42);x.textAlign='left';}}
function loop(t){const dt=Math.min(.04,(t-last||0)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}window.chooseClass=name=>{selectedClass=name;selectedBoss=document.querySelector('#boss-select').value;reset();document.querySelector('#class-screen').setAttribute('hidden','');c.focus();};reset();requestAnimationFrame(()=>c.focus());requestAnimationFrame(loop);
