<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adlai's Tetris</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #26325f, #101424 55%); font: 16px system-ui, sans-serif; color: #f7f7fb; }
  main { display: grid; grid-template-columns: auto minmax(150px, 210px); gap: 24px; padding: 24px; align-items: start; }
  h1 { margin: 0 0 8px; font-size: 1.5rem; } p { margin: 0 0 18px; color: #c5cbe7; }
  canvas { display: block; background: #0a0d1a; border: 3px solid #6474bd; box-shadow: 0 16px 45px #0008; }
  .panel { padding-top: 4px; } .score { font-size: 2rem; font-weight: 800; margin: 4px 0 20px; }
  button { border: 0; border-radius: 8px; background: #6c7cff; color: white; cursor: pointer; padding: 10px 16px; font: inherit; font-weight: 700; }
  button:hover { background: #8491ff; } .page-link { display:block; border-radius:8px; background:#252c4a; color:white; padding:7px 10px; text-decoration:none; font-weight:700; font-size:.9rem; } .page-link:hover { background:#35406c; } .menu { margin-top: 10px; display: grid; gap: 6px; } .menu[hidden] { display: none; } .skin-choice { background: #252c4a; padding: 7px 10px; font-size: .9rem; } .help { margin-top: 20px; line-height: 1.6; font-size: .9rem; }
  kbd { background: #252c4a; border-radius: 4px; padding: 2px 5px; }
  @media (max-width: 600px) { main { grid-template-columns: 1fr; justify-items: center; padding: 16px; } .panel { text-align: center; } }
</style>
</head>
<body>
<main>
  <canvas id="game" width="300" height="600" tabindex="0" aria-label="Tetris game"></canvas>
  <section class="panel">
    <h1>Adlai's Tetris</h1>
    <p>Clear lines. Chase a high score.</p>
    <div>Score</div><div id="score" class="score">0</div>
    <button id="restart">New game</button><button id="skins">Choose skin</button><button id="pages">Pages</button><div id="page-menu" class="menu" hidden><a class="page-link" href="./">Tetris</a><a class="page-link" href="hello.html">Hello world</a><a class="page-link" href="bossfight.html">Boss fight</a><a class="page-link" href="undying-practice.html">Spear Guard Practice</a><a class="page-link" href="rogue-ascent.html">Eightfold Roguelike</a></div><div id="skin-menu" class="menu" hidden><button class="skin-choice" data-skin="regular">Regular blocks</button><button class="skin-choice" data-skin="sandwich">Sandwiches</button><button class="skin-choice" data-skin="retro">Retro sandwiches</button><button class="skin-choice" data-skin="dogs">Dogs</button></div>
    <p class="help"><kbd>A</kbd> <kbd>D</kbd> move<br><kbd>S</kbd> drop<br><kbd>W</kbd> / <kbd>R</kbd> rotate<br><kbd>Space</kbd> hard drop</p>
  </section>
</main>
<script>
const canvas = document.querySelector('#game'), ctx = canvas.getContext('2d');
const scale = 30, cols = 10, rows = 20;
ctx.scale(scale, scale);
const colors = [null, '#46d9ff', '#5876f2', '#ff9d3d', '#ffe45c', '#63df7b', '#ba71f4', '#ff5e7c', '#ffd84d'];
const shapes = [null, [[1,1,1,1]], [[2,0,0],[2,2,2]], [[0,0,3],[3,3,3]], [[4,4],[4,4]], [[0,5,5],[5,5,0]], [[0,6,0],[6,6,6]], [[7,7,0],[0,7,7]]];
let board, piece, score = 0, last = 0, fall = 0, over = false, enterTimes = [], particles = [], munches = [], skin = 'regular';
function emptyBoard() { return Array.from({length: rows}, () => Array(cols).fill(0)); }
function drawSandwich(x,y,width){ctx.fillStyle='#a95a28';ctx.fillRect(x,y+.12,width,.18);ctx.fillStyle='#f0b76b';ctx.fillRect(x,y+.08,width,.17);ctx.fillStyle='#62a842';ctx.fillRect(x,y+.29,width,.09);ctx.fillStyle='#e94b34';for(let px=x+.12;px<x+width;px+=.7)ctx.fillRect(px,y+.39,.35,.1);ctx.fillStyle='#6b321d';ctx.fillRect(x,y+.49,width,.16);ctx.fillStyle='#e7a65b';ctx.fillRect(x,y+.65,width,.2);ctx.fillStyle='#ffd78d';for(let px=x+.25;px<x+width;px+=.55)ctx.fillRect(px,y+.12,.06,.04);}
function drawMatrix(matrix, offset) {if(skin==='sandwich'){matrix.forEach((row,y)=>{let x=0;while(x<row.length){if(!row[x]){x++;continue;}const start=x;while(x<row.length&&row[x])x++;drawSandwich(start+offset.x,y+offset.y,x-start);}});return;}matrix.forEach((row,y)=>row.forEach((v,x)=>{if(v){const px=x+offset.x,py=y+offset.y;if(skin==='regular'){ctx.fillStyle=colors[v];ctx.fillRect(px,py,.96,.96);}else if(skin==='retro'){ctx.fillStyle='#d7a94e';ctx.fillRect(px,py,.96,.96);ctx.font='.8px sans-serif';ctx.textAlign='center';ctx.fillText('🥪',px+.48,py+.72);}else{ctx.fillStyle='#795033';ctx.fillRect(px,py,.96,.96);ctx.font='.8px sans-serif';ctx.textAlign='center';ctx.fillText('🐶',px+.48,py+.72);}}}));}
function drawParticles(){for(const p of particles){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,.14,.14);}ctx.globalAlpha=1;}
function drawMunches(){for(const m of munches){const start=Math.max(0,m.x+.5),width=cols-start;if(skin==='retro'){ctx.font='.8px sans-serif';ctx.textAlign='center';for(let x=Math.max(0,Math.ceil(m.x+.4));x<cols;x++)ctx.fillText('🥪',x+.5,m.y+.3);}else if(width>0){ctx.fillStyle='#a95a28';ctx.fillRect(start,m.y+.12,width,.18);ctx.fillStyle='#f0b76b';ctx.fillRect(start,m.y+.08,width,.17);ctx.fillStyle='#62a842';ctx.fillRect(start,m.y+.29,width,.09);ctx.fillStyle='#e94b34';for(let x=start+.12;x<cols;x+=.7)ctx.fillRect(x,m.y+.39,.35,.1);ctx.fillStyle='#6b321d';ctx.fillRect(start,m.y+.49,width,.16);ctx.fillStyle='#e7a65b';ctx.fillRect(start,m.y+.65,width,.2);ctx.fillStyle='#ffd78d';for(let x=start+.25;x<cols;x+=.55)ctx.fillRect(x,m.y+.12,.06,.04);}const py=m.y+.34;ctx.save();ctx.shadowColor='#fff7a0';ctx.shadowBlur=.32;ctx.fillStyle='#ffeb16';ctx.beginPath();ctx.moveTo(m.x+.52,py);ctx.arc(m.x+.52,py,.62,.35,Math.PI*1.65);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#151515';ctx.beginPath();ctx.arc(m.x+.48,py-.32,.075,0,Math.PI*2);ctx.fill();ctx.restore();}}
function draw() { ctx.fillStyle='#0a0d1a'; ctx.fillRect(0,0,cols,rows); drawMatrix(board,{x:0,y:0}); drawMatrix(piece.matrix,piece.pos); drawParticles(); drawMunches(); if(over){ctx.fillStyle='#000b';ctx.fillRect(0,8,10,4);ctx.fillStyle='white';ctx.font='1px system-ui';ctx.textAlign='center';ctx.fillText('GAME OVER',5,10);ctx.font='.5px system-ui';ctx.fillText('Press New game',5,11.1);} }
function collide() { for(let y=0;y<piece.matrix.length;y++) for(let x=0;x<piece.matrix[y].length;x++) if(piece.matrix[y][x] && (board[y+piece.pos.y] && board[y+piece.pos.y][x+piece.pos.x]) !== 0) return true; return false; }
function merge() { piece.matrix.forEach((row,y)=>row.forEach((v,x)=>{if(v)board[y+piece.pos.y][x+piece.pos.x]=v;})); }
function shatter(y){if(skin==='sandwich'||skin==='retro'){munches.push({x:-.7,y:y+.5,life:1});return;}for(let x=0;x<cols;x++)for(let i=0;i<8;i++)particles.push({x:x+.5,y:y+.5,vx:(Math.random()-.5)*.22,vy:-Math.random()*.28,life:1,color:colors[board[y][x]]||'#fff'});}
function sweep() { let bonus=0; outer: for(let y=rows-1;y>=0;y--){for(let x=0;x<cols;x++)if(!board[y][x])continue outer; shatter(y);board.splice(y,1);board.unshift(Array(cols).fill(0));y++;bonus=bonus?bonus*2:100;}score+=bonus;document.querySelector('#score').textContent=score; }
function spawn() { const n=1+Math.floor(Math.random()*7); piece={matrix:shapes[n].map(r=>r.slice()),pos:{x:Math.floor((cols-shapes[n][0].length)/2),y:0}};if(collide())over=true; }
function drop(){piece.pos.y++;if(collide()){piece.pos.y--;merge();sweep();spawn();}fall=0;}
function move(dx){piece.pos.x+=dx;if(collide())piece.pos.x-=dx;}
function rotateMatrix(m){return m[0].map((_,x)=>m.map(row=>row[x]).reverse());}
function rotate(){const old=piece.matrix;piece.matrix=rotateMatrix(old);if(collide())piece.matrix=old;}
function createPerfectPiece(){let best=null;for(let start=0;start<rows;start++){const matrix=[];for(let end=start;end<Math.min(rows,start+4);end++){if(!board[end].some(Boolean))break;matrix.push(board[end].map(v=>v?0:8));let supported=true;for(let x=0;x<cols;x++){for(let dy=matrix.length-1;dy>=0;dy--){if(matrix[dy][x]){if(start+dy<rows-1&&!board[start+dy+1][x])supported=false;break;}}}if(supported&&(!best||matrix.length>best.length))best=matrix.map(row=>row.slice());}}if(best)piece={matrix:best,pos:{x:0,y:0}};}
function update(t=0){const dt=t-last;last=t;fall+=dt;particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.014;p.life-=.025;return p.life>0;});munches=munches.filter(m=>{m.x+=.18;m.life-=.025;return m.x<cols+1;});if(!over&&fall>700)drop();draw();requestAnimationFrame(update);}
window.addEventListener('keydown',e=>{if(over)return; if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp','a','A','d','D','s','S','w','W','r','R','Enter',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')move(-1);if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')move(1);if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')drop();if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'||e.key==='r'||e.key==='R')rotate();if(e.key==='Enter'){const now=Date.now();enterTimes=enterTimes.filter(t=>now-t<650);enterTimes.push(now);if(enterTimes.length>=3){createPerfectPiece();enterTimes=[];}}if(e.key===' '){while(!collide()){piece.pos.y++;}piece.pos.y--;drop();}});
document.querySelector('#restart').onclick=()=>{board=emptyBoard();score=0;over=false;particles=[];munches=[];document.querySelector('#score').textContent=0;spawn();canvas.focus();};
document.querySelector('#skins').onclick=()=>document.querySelector('#skin-menu').toggleAttribute('hidden');
document.querySelector('#pages').onclick=()=>document.querySelector('#page-menu').toggleAttribute('hidden');
document.querySelectorAll('[data-skin]').forEach(button=>button.onclick=()=>{skin=button.dataset.skin;document.querySelector('#skin-menu').setAttribute('hidden','');canvas.focus();});
board=emptyBoard();spawn();requestAnimationFrame(()=>canvas.focus());window.addEventListener('focus',()=>canvas.focus());update();
</script>
<a href="./undying-practice.html">Spear Guard Practice</a></body>
</html>
