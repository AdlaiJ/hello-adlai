<!doctype html><title>Spear Guard Practice</title><style>body{background:#111;color:white;font:16px system-ui;text-align:center}canvas{border:4px solid white}</style><h1>Spear Guard Practice</h1><p>WASD move · Arrow keys turn shield · Block incoming spears</p><canvas id=c width=640 height=480></canvas><script>let c=document.querySelector("#c"),x=c.getContext("2d"),k={},p={x:320,y:360,a:-1.57,h:100},s=[],t=0,last=0;addEventListener("keydown",e=>{if(["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"].includes(e.key.toLowerCase()))e.preventDefault();k[e.key.toLowerCase()]=1});addEventListener("keyup",e=>k[e.key.toLowerCase()]=0);function L(n){let d=Math.min(.03,(n-last)/1e3||0);last=n;t+=d;if(Math.random()<d*(2+t/10)){let a=Math.random()*6.28;s.push({x:320+Math.cos(a)*420,y:240+Math.sin(a)*420,a:Math.atan2(p.y-(240+Math.sin(a)*420),p.x-(320+Math.cos(a)*420))})}let dx=(k.d||k.arrowright)-(k.a||k.arrowleft),dy=(k.s||k.arrowdown)-(k.w||k.arrowup);if(dx||dy){let z=Math.hypot(dx,dy);p.x=Math.max(15,Math.min(625,p.x+dx/z*200*d));p.y=Math.max(15,Math.min(465,p.y+dy/z*200*d))}if(k.arrowup)p.a=-1.57;if(k.arrowdown)p.a=1.57;if(k.arrowleft)p.a=3.14;if(k.arrowright)p.a=0;for(let q of s){q.x+=Math.cos(q.a)*180*d;q.y+=Math.sin(q.a)*180*d;let X=q.x-p.x,Y=q.y-p.y;if(Math.hypot(X,Y)<20){if(X*Math.cos(p.a)+Y*Math.sin(p.a)>0)s.splice(s.indexOf(q),1);else{p.h-=15;s.splice(s.indexOf(q),1)}}}x.fillStyle="#090b15";x.fillRect(0,0,640,480);x.fillStyle="white";for(let q of s)x.fillRect(q.x-10,q.y-3,24,6);x.strokeStyle="#5ff";x.lineWidth=9;x.beginPath();x.arc(p.x,p.y,25,p.a-.6,p.a+.6);x.stroke();x.fillStyle="#fc8";x.beginPath();x.arc(p.x,p.y,12,0,7);x.fill();x.fillStyle="white";x.fillText("Health "+p.h,15,20);requestAnimationFrame(L)}requestAnimationFrame(L)</script>
