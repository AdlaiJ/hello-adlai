<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101526"><title>Tic-Tac-Toe — Adlai's Games</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#eff3ff;background:#101526}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#243356,transparent 65%)}a{color:#aabfff;text-decoration:none}header{padding:22px 26px;display:flex;justify-content:space-between;font-weight:700}main{max-width:480px;margin:18px auto;padding:0 22px 30px}h1{font-size:clamp(32px,8vw,46px);letter-spacing:-2px;margin:0}p{color:#aebbd5;line-height:1.5}.eyebrow{font-size:12px;letter-spacing:3px;color:#70e4cf;font-weight:800}.settings{display:flex;gap:12px;margin:24px 0 10px}.settings label{flex:1;font-size:12px;color:#aebbd5}select,button{font:inherit}select{width:100%;margin-top:7px;padding:12px;border:1px solid #425071;border-radius:10px;background:#1a243b;color:#fff}#hint{font-size:13px;min-height:40px;margin:8px 0}#status{font-size:21px;font-weight:750;min-height:32px;margin:16px 0}#board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cell{aspect-ratio:1;border:1px solid #34415d;border-radius:17px;background:#1b263e;box-shadow:0 6px 0 #0a1020;color:#7cead7;font-size:clamp(44px,14vw,72px);font-weight:800;cursor:pointer;transition:background .15s,transform .15s}.cell:not(:disabled):hover{background:#2b3b5b;transform:translateY(-2px)}.cell.o{color:#bda4ff}.cell.win{background:#284b46;border-color:#7cead7}.cell:disabled{cursor:default;opacity:1}.cell.mark{animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.91)}to{transform:scale(1)}}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #ffdc89;outline-offset:4px}.actions{display:flex;gap:10px;margin:24px 0}.actions button{flex:1;border:1px solid #425071;border-radius:10px;padding:12px;cursor:pointer;background:#25344f;color:#fff}.actions button:first-child{background:#7cead7;color:#0b2728;border-color:#7cead7;font-weight:800}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;background:#151e32;border:1px solid #34415d;border-radius:14px;padding:16px}.scores span{display:block;color:#aebbd5;font-size:12px}.scores strong{font-size:25px}.note{font-size:12px;text-align:center}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><header><a href="./">← All games</a><span>X / O</span></header><main><div class="eyebrow">THREE IN A ROW</div><h1>Tic-Tac-Toe</h1><p>Pick your opponent. Outsmart the bot.<br>Get three marks in a row, column, or diagonal.</p><div class="settings"><label>Bot difficulty<select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label><label>Play as<select id="side"><option value="X">X · go first</option><option value="O">O · go second</option></select></label></div><p id="hint"></p><div id="status" role="status" aria-live="polite"></div><div id="board" role="group" aria-label="Tic-Tac-Toe board"></div><div class="actions"><button id="newRound">New round</button><button id="resetScore">Reset scores</button></div><div class="scores" aria-label="Session scores"><div><strong id="wins">0</strong><span>You</span></div><div><strong id="draws">0</strong><span>Draws</span></div><div><strong id="losses">0</strong><span>Bot</span></div></div><p class="note">Scores last until you leave this page. Changing settings starts a new round.</p></main>
<script>
const TicTacToe=(()=>{
 const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 const other=p=>p==='X'?'O':'X';
 function result(b){for(const line of lines)if(b[line[0]]&&line.every(i=>b[i]===b[line[0]]))return {winner:b[line[0]],line};return b.every(Boolean)?{winner:'draw',line:[]}:null}
 const empty=b=>b.map((v,i)=>v?-1:i).filter(i=>i>=0);
 function score(b,turn,bot,depth=0){const r=result(b);if(r)return r.winner==='draw'?0:r.winner===bot?10-depth:depth-10;const values=empty(b).map(i=>{b[i]=turn;const v=score(b,other(turn),bot,depth+1);b[i]='';return v});return turn===bot?Math.max(...values):Math.min(...values)}
 function choose(board,bot,level,random=Math.random){const b=board.slice(),moves=empty(b);if(result(b)||!moves.length)return null;
  const pick=()=>moves[Math.min(moves.length-1,Math.floor(random()*moves.length))];
  if(level==='easy')return pick();
  if(level==='medium'){for(const player of [bot,other(bot)])for(const i of moves){b[i]=player;const r=result(b);b[i]='';if(r?.winner===player)return i}return pick()}
  let best=-Infinity,move=moves[0];for(const i of [4,0,2,6,8,1,3,5,7].filter(i=>!b[i])){b[i]=bot;const v=score(b,other(bot),bot,0);b[i]='';if(v>best){best=v;move=i}}return move;
 }
 return {result,choose,other};
})();
</script><script>
const $=s=>document.querySelector(s),cells=[];let board,turn,human,bot,finished,timer=null,scores={wins:0,draws:0,losses:0};
const hints={easy:'Easy plays random moves. A relaxed place to learn.',medium:'Medium takes a win or blocks yours, but can miss a clever setup.',hard:'Hard plans every move. Play perfectly to earn a draw!'};
for(let i=0;i<9;i++){const cell=document.createElement('button');cell.className='cell';cell.onclick=()=>{if(finished||turn!==human||board[i])return;move(i);scheduleBot()};$('#board').append(cell);cells.push(cell)}
function render(){const r=TicTacToe.result(board);cells.forEach((c,i)=>{c.textContent=board[i];c.className='cell'+(board[i]?' mark':'')+(board[i]==='O'?' o':'')+(r?.line.includes(i)?' win':'');c.disabled=finished||turn!==human||!!board[i];c.setAttribute('aria-label',`Row ${Math.floor(i/3)+1}, column ${i%3+1}: ${board[i]||'empty'}`)});$('#status').textContent=r?(r.winner==='draw'?"It's a draw!":r.winner===human?'You win!':'Bot wins. Try again!'):turn===human?`Your turn · ${human}`:`Bot is thinking · ${bot}`;for(const key of Object.keys(scores))$('#'+key).textContent=scores[key]}
function move(i){board[i]=turn;const r=TicTacToe.result(board);if(r){finished=true;scores[r.winner==='draw'?'draws':r.winner===human?'wins':'losses']++}else turn=TicTacToe.other(turn);render()}
function scheduleBot(){if(finished||turn!==bot)return;timer=setTimeout(()=>{timer=null;if(finished||turn!==bot)return;const i=TicTacToe.choose(board,bot,$('#difficulty').value);if(i!==null)move(i)},400)}
function start(){clearTimeout(timer);timer=null;board=Array(9).fill('');turn='X';human=$('#side').value;bot=TicTacToe.other(human);finished=false;$('#hint').textContent=hints[$('#difficulty').value];render();scheduleBot()}
$('#newRound').onclick=start;$('#difficulty').onchange=start;$('#side').onchange=start;$('#resetScore').onclick=()=>{scores={wins:0,draws:0,losses:0};render()};start();
</script></body></html>
